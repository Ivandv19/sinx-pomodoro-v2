# Tempo CI/CD — lint -> unit -> e2e -> deploy (solo main push)
# Flujo: push/PR a main/develop dispara lint+unit en paralelo, e2e espera ambos, deploy solo en main

name: Tempo CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # lint: Biome lint + format — fail fast, bloquea e2e
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run check

  # unit: Vitest 58 tests (slices) — paralelo a lint
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Tests unitarios
        run: bun run test:unit

  # e2e: Playwright 24 tests (hashy-stub + wrangler :4321/:4322) — needs lint+unit
  e2e:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-e2e: reutiliza setup + Playwright browsers + .dev.vars
      - name: Setup E2E
        uses: ./.github/actions/setup-e2e
        with:
          better-auth-secret: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Suite E2E (Playwright)
        run: bun run test:e2e

      # Subir traces/screenshots solo si falla — fuera del composite para visibilidad y if: failure()
      - name: Subir resultados E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # Artifact dist para deploy (Opción A) — evita 2º astro build (1.4s + cache)
      - name: Subir dist para deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-e2e
          path: dist/
          retention-days: 1

  # deploy: solo push a main y con todo verde — build + pages deploy (usa artifact dist si viene de e2e)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Bajar dist desde e2e (artifact)
        uses: actions/download-artifact@v4
        with:
          name: dist-e2e
          path: dist/
        continue-on-error: true

      - name: Build (si no hay dist de artifact)
        run: |
          if [ -d dist ] && [ -f dist/index.html ]; then
            echo "dist desde artifact e2e, skip build"
          else
            bun run build
          fi
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=tempo
